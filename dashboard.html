<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Bharat — Dashboard</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#171022; --ink-soft:#4A4358; --paper:#FBFAFE; --paper-raised:#FFFFFF; --line:#E7E2F2;
    --purple:#743AE8; --purple-dark:#5B2BC0; --lilac:#9A6DF5; --lilac-soft:#F1ECFD;
    --leaf:#1F8A5C; --leaf-soft:#EAF6EF; --amber:#A6690F; --amber-soft:#FBF1DF; --red:#B23A3A; --red-soft:#FAEBEA;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#F1EEF8; --ink-soft:#B6ADC9; --paper:#100B18; --paper-raised:#1A1424; --line:#2C2438;
      --purple:#B39CF4; --purple-dark:#C9B6FF; --lilac:#9A6DF5; --lilac-soft:#211A2E;
      --leaf:#63C79A; --leaf-soft:#16281F; --amber:#D9A75C; --amber-soft:#2C2415; --red:#DE8886; --red-soft:#2B1919;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Roboto',system-ui,sans-serif;}
  .wrap{max-width:760px; margin:0 auto; padding:34px 22px 60px;}
  header{display:flex; align-items:center; gap:13px; margin-bottom:30px;}
  .monogram{width:42px; height:42px; border-radius:50%; border:1.4px solid var(--purple); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.82rem; color:var(--purple); flex-shrink:0;}
  .brand-name{font-weight:600; font-size:1.06rem;}
  .brand-sub{font-weight:400; font-size:0.72rem; color:var(--ink-soft); margin-top:1px;}
  h1{font-size:1.3rem; font-weight:600; margin:0 0 4px;}
  .lede{color:var(--ink-soft); font-size:0.88rem; font-weight:300; margin:0 0 28px;}

  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:28px;}
  .stat-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:18px;}
  .stat-num{font-size:1.8rem; font-weight:700; color:var(--purple);}
  .stat-label{font-size:0.78rem; color:var(--ink-soft); margin-top:2px;}

  section{margin-bottom:30px;}
  h2{font-size:0.95rem; font-weight:600; margin:0 0 14px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:0.82rem;}
  .bar-label{width:110px; flex-shrink:0; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1; height:10px; background:var(--lilac-soft); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--purple); border-radius:6px;}
  .bar-count{width:34px; text-align:right; color:var(--ink-soft); flex-shrink:0;}

  table{width:100%; border-collapse:collapse; font-size:0.8rem;}
  th{text-align:left; padding:8px 10px; color:var(--ink-soft); font-weight:500; border-bottom:1px solid var(--line);}
  td{padding:9px 10px; border-bottom:1px solid var(--line);}
  .sev-badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.72rem; font-weight:700;}
  .sev-low{background:var(--leaf-soft); color:var(--leaf);}
  .sev-mid{background:var(--amber-soft); color:var(--amber);}
  .sev-high{background:var(--red-soft); color:var(--red);}
  .status-pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.72rem; font-weight:600; background:var(--lilac-soft); color:var(--purple);}
  .status-pill.resolved{background:var(--leaf-soft); color:var(--leaf);}

  .btn{border:none; border-radius:10px; padding:9px 16px; font-size:0.8rem; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--purple); color:#fff;}
  .btn-outline{background:none; border:1px solid var(--line); color:var(--ink);}
  .empty{color:var(--ink-soft); font-size:0.85rem; text-align:center; padding:40px 10px;}
  .admin-bar{display:flex; justify-content:flex-end; margin-bottom:16px;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="monogram">NB</div>
    <div><div class="brand-name">New Bharat</div><div class="brand-sub">Public Dashboard — Design by Sanx</div></div>
  </header>

  <h1>Swachh Bharat — Live Reports</h1>
  <p class="lede">Is app se ab tak submit hui saari reports ka summary — location aur photo details privately rakhe jaate hai, yaha sirf aggregate trends dikhte hai.</p>

  <div class="admin-bar"><button class="btn btn-outline" id="adminToggleBtn">Admin View</button></div>

  <div id="content">
    <div class="empty">Load ho raha hai…</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Same config as index.html — Sanx, paste apna Firebase config yaha bhi.
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCZbzqfIDuxN2MKYuI1WJhJKPjdO0rSqUY",
    authDomain: "new-bharat-33f79.firebaseapp.com",
    projectId: "new-bharat-33f79",
    storageBucket: "new-bharat-33f79.firebasestorage.app",
    messagingSenderId: "202897904279",
    appId: "1:202897904279:web:8dd5fa9fbedb8088088fd2"
  };

  var ADMIN_PASSWORD = "sanx123"; // Sanx: ise change kar lena — settings mein hardcoded hai, bahut secure nahi hai

  var contentEl = document.getElementById('content');
  var isAdmin = false;

  document.getElementById('adminToggleBtn').addEventListener('click', function(){
    if(isAdmin){ isAdmin = false; render(window.__reports || []); this.textContent = 'Admin View'; return; }
    var pass = prompt('Admin password:');
    if(pass === ADMIN_PASSWORD){
      isAdmin = true;
      document.getElementById('adminToggleBtn').textContent = 'Public View';
      render(window.__reports || []);
    } else if(pass !== null){
      alert('Galat password.');
    }
  });

  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sevClass(l){ if(l<=2) return 'sev-low'; if(l===3) return 'sev-mid'; return 'sev-high'; }

  function render(reports){
    if(!reports.length){
      contentEl.innerHTML = '<div class="empty">Abhi koi report nahi aayi hai.</div>';
      return;
    }
    var total = reports.length;
    var resolved = reports.filter(function(r){ return r.status === 'resolved'; }).length;
    var urgent = reports.filter(function(r){ return (r.urgency||'').toLowerCase() === 'urgent'; }).length;
    var cityCount = {};
    reports.forEach(function(r){ var c = r.city || 'Unknown'; cityCount[c] = (cityCount[c]||0)+1; });
    var cityList = Object.keys(cityCount).map(function(c){ return {city:c, count:cityCount[c]}; }).sort(function(a,b){ return b.count-a.count; }).slice(0,8);
    var maxCity = cityList.length ? cityList[0].count : 1;

    var sevCount = [0,0,0,0,0];
    reports.forEach(function(r){ var l = Number(r.severityLevel)||1; if(l>=1&&l<=5) sevCount[l-1]++; });
    var maxSev = Math.max.apply(null, sevCount) || 1;

    var html = '';
    html += '<div class="stat-grid">' +
      '<div class="stat-card"><div class="stat-num">'+total+'</div><div class="stat-label">Total Reports</div></div>' +
      '<div class="stat-card"><div class="stat-num">'+resolved+'</div><div class="stat-label">Resolved</div></div>' +
      '<div class="stat-card"><div class="stat-num">'+urgent+'</div><div class="stat-label">Urgent Cases</div></div>' +
      '<div class="stat-card"><div class="stat-num">'+cityList.length+'</div><div class="stat-label">Areas Covered</div></div>' +
      '</div>';

    html += '<section><h2>Top Areas</h2>';
    cityList.forEach(function(c){
      var pct = Math.round((c.count/maxCity)*100);
      html += '<div class="bar-row"><div class="bar-label">'+escapeHtml(c.city)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div></div><div class="bar-count">'+c.count+'</div></div>';
    });
    html += '</section>';

    html += '<section><h2>Severity Breakdown</h2>';
    for(var i=5;i>=1;i--){
      var pct2 = Math.round((sevCount[i-1]/maxSev)*100);
      html += '<div class="bar-row"><div class="bar-label">Level '+i+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct2+'%;"></div></div><div class="bar-count">'+sevCount[i-1]+'</div></div>';
    }
    html += '</section>';

    html += '<section><h2>Recent Reports</h2><div class="table-wrap"><table><thead><tr>' +
      '<th>Date</th><th>Area</th><th>Type</th><th>Severity</th><th>Status</th>' + (isAdmin ? '<th></th>' : '') + '</tr></thead><tbody>';
    reports.slice(0, 50).forEach(function(r){
      var d = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : null;
      var dStr = d ? d.toLocaleDateString('en-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '—';
      var lvl = Number(r.severityLevel) || 1;
      html += '<tr>' +
        '<td>'+dStr+'</td>' +
        '<td>'+escapeHtml(r.city||r.area||'—')+'</td>' +
        '<td>'+escapeHtml(r.wasteType||'—')+'</td>' +
        '<td><span class="sev-badge '+sevClass(lvl)+'">'+lvl+'/5</span></td>' +
        '<td><span class="status-pill'+(r.status==='resolved'?' resolved':'')+'">'+escapeHtml(r.status||'open')+'</span></td>' +
        (isAdmin ? '<td>'+(r.status!=='resolved' ? '<button class="btn btn-outline resolve-btn" data-id="'+r.__id+'" style="padding:5px 10px; font-size:0.72rem;">Resolve</button>' : '')+'</td>' : '') +
        '</tr>';
    });
    html += '</tbody></table></div></section>';

    contentEl.innerHTML = html;

    if(isAdmin){
      contentEl.querySelectorAll('.resolve-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.dataset.id;
          firebase.firestore().collection('reports').doc(id).update({ status: 'resolved' }).then(function(){
            btn.closest('tr').querySelector('.status-pill').textContent = 'resolved';
            btn.closest('tr').querySelector('.status-pill').classList.add('resolved');
            btn.remove();
          }).catch(function(){ alert('Update nahi ho paya.'); });
        });
      });
    }
  }

  try{
    if(!FIREBASE_CONFIG.apiKey){
      contentEl.innerHTML = '<div class="empty">Firebase config abhi set nahi hai.</div>';
    } else {
      firebase.initializeApp(FIREBASE_CONFIG);
      firebase.firestore().collection('reports').orderBy('createdAt', 'desc').limit(200).get().then(function(snap){
        var reports = [];
        snap.forEach(function(doc){
          var d = doc.data(); d.__id = doc.id; reports.push(d);
        });
        window.__reports = reports;
        render(reports);
      }).catch(function(err){
        contentEl.innerHTML = '<div class="empty">Data load nahi ho paya.</div>';
      });
    }
  }catch(e){
    contentEl.innerHTML = '<div class="empty">Kuch gadbad ho gayi.</div>';
  }
})();
</script>
</body>
</html>
